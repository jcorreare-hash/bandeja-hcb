<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandeja HCB</title>
<meta name="description" content="Bandeja para responder los mensajes laborales de WhatsApp de las madres comunitarias.">
<meta name="theme-color" content="#1f6170">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bandeja HCB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #f3f6f6; --surface: #ffffff; --surface-2: #e8eeee; --line: #d3dddd;
  --fg: #142a2f; --muted: #557075; --accent: #1f6170; --accent-ink: #ffffff; --accent-soft: #d9ebee;
  --urgent: #b42318; --urgent-soft: #fde8e6; --high: #a15c07; --high-soft: #fdf0d9; --normal: #8aa0a4;
  --ok: #217a4a; --ok-soft: #dff2e6; --wa: #1f8a4c;
  --font: "Segoe UI", Roboto, "Helvetica Neue", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1719; --surface: #152226; --surface-2: #1c2d31; --line: #2a3f44;
    --fg: #e4eeef; --muted: #9bb3b7; --accent: #6fbccb; --accent-ink: #062126; --accent-soft: #173a42;
    --urgent: #ff8a7f; --urgent-soft: #3a1714; --high: #f0b25a; --high-soft: #35260f; --normal: #5f777b;
    --ok: #6fd39c; --ok-soft: #12321f; --wa: #3fbf76; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(130px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.wrap { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
h1 { font-size: 1.4rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 0.84rem; margin: 2px 0 0; }
.iconbtn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .iconbtn.spin svg { animation: none; } }
.hdr-actions { display: flex; gap: 8px; }
.banner { padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; }
.banner.urgent { background: var(--urgent-soft); color: var(--urgent); }
.banner.info { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.banner.install { background: var(--accent-soft); color: var(--fg); font-weight: 500; display: flex; gap: 10px; align-items: center; justify-content: space-between; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; position: sticky; top: calc(6px + env(safe-area-inset-top, 0px)); z-index: 5; box-shadow: 0 2px 10px rgb(0 0 0 / 0.06); }
.tab { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 0.86rem; min-height: 40px; padding: 6px 6px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.1); }
.tab .n { font-variant-numeric: tabular-nums; margin-left: 4px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); font-size: 0.76rem; }
.tab[aria-selected="true"] .n { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-size: 0.82rem; font-weight: 600; padding: 6px 12px; min-height: 36px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.list { display: grid; gap: 12px; }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); font-size: 0.92rem; }
.empty strong { display: block; color: var(--fg); font-size: 1rem; margin-bottom: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: 5px 1fr; }
.stripe { background: var(--normal); }
.card[data-prio="Urgente"] .stripe { background: var(--urgent); }
.card[data-prio="Alta"] .stripe { background: var(--high); }
.body { padding: 14px; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.who { font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.time { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.where { color: var(--muted); font-size: 0.82rem; margin-top: -8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.where a { color: var(--accent); font-weight: 700; text-decoration: none; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; background: var(--surface-2); color: var(--fg); }
.pill.cat { background: var(--accent-soft); color: var(--accent); }
.pill.prio-Urgente, .pill.deadline { background: var(--urgent-soft); color: var(--urgent); }
.pill.prio-Alta { background: var(--high-soft); color: var(--high); }
.pill.state { background: var(--ok-soft); color: var(--ok); }
.summary { font-weight: 600; font-size: 1rem; margin: 0; line-height: 1.4; }
details { border-radius: 10px; background: var(--surface-2); }
details > summary { list-style: none; cursor: pointer; padding: 10px 12px; color: var(--muted); font-size: 0.86rem; font-weight: 700; min-height: 40px; display: flex; align-items: center; justify-content: space-between; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "Ver"; font-weight: 600; color: var(--accent); }
details[open] > summary::after { content: "Ocultar"; }
details .inner { padding: 0 12px 12px; font-size: 0.92rem; display: grid; gap: 8px; }
details .inner p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.lbl { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin: 0; }
.options { display: grid; gap: 8px; }
.opt { text-align: left; font-size: 0.95rem; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 40px; min-height: 48px; cursor: pointer; position: relative; line-height: 1.45; overflow-wrap: anywhere; }
.opt::before { content: ""; position: absolute; left: 13px; top: 15px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"]::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.opt.own { color: var(--muted); font-weight: 600; }
textarea, input[type=text], input[type=url], input[type=password] { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 96px; }
textarea:focus, input:focus-visible, .opt:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fwd { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.switch { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-weight: 600; font-size: 0.92rem; cursor: pointer; min-height: 40px; }
.switch .num { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); transition: left 0.15s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { left: 21px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 0.86rem; padding: 6px 0; cursor: pointer; justify-self: start; min-height: 36px; text-align: left; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { font-weight: 700; font-size: 0.95rem; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.full { grid-column: 1 / -1; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; font-size: 1rem; min-height: 52px; }
.btn.quiet { color: var(--muted); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }
.final { white-space: pre-wrap; background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; overflow-wrap: anywhere; }
.send-list { display: grid; gap: 8px; }
.send-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.send-item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.send-item .who2 { font-weight: 700; font-size: 0.92rem; }
.send-item .st { font-size: 0.76rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--high-soft); color: var(--high); white-space: nowrap; }
.send-item .st.done { background: var(--ok-soft); color: var(--ok); }
.send-item .txt { font-size: 0.86rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 4.6em; overflow: hidden; }
.send-item .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.send-item .btn { min-height: 44px; font-size: 0.9rem; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 30; display: grid; align-items: end; }
.sheet { background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-width: 600px; width: 100%; margin: 0 auto; box-shadow: 0 -8px 30px rgb(0 0 0 / 0.25); }
.sheet h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; }
.sheet p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.sheet .btns { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; gap: 12px; align-items: center; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; font-weight: 600; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgb(0 0 0 / 0.2); }
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 800; padding: 6px 4px; cursor: pointer; text-decoration: underline; }
.setup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.setup h2 { margin: 0; font-size: 1.15rem; }
.setup p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.setup label { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
.err { color: var(--urgent); font-weight: 600; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Bandeja HCB</h1>
      <p class="sub" id="last">Cargando…</p>
    </div>
    <div class="hdr-actions">
      <button class="iconbtn" id="btn-refresh" type="button" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="iconbtn" id="btn-settings" type="button" aria-label="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.54V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.54-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.54V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.54 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.54 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="setup" class="setup" hidden>
    <h2>Conectar la bandeja</h2>
    <p>Pega el enlace del puente (la aplicación web de Apps Script) y la clave. Solo se hace una vez en este celular.</p>
    <label>Enlace del puente<input type="url" id="cfg-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Clave<input type="password" id="cfg-key" autocomplete="off"></label>
    <p class="err" id="cfg-err" hidden></p>
    <button class="btn primary" id="cfg-save" type="button">Conectar</button>
    <button class="btn quiet" id="cfg-cancel" type="button" hidden>Cancelar</button>
  </div>

  <div id="main" hidden>
    <div class="wrap">
      <div class="banner install" id="install" hidden></div>
      <div class="banner info" id="offline" hidden></div>
      <div class="banner urgent" id="alert" hidden></div>
      <div class="tabs" role="tablist" aria-label="Estado de los casos">
        <button class="tab" role="tab" data-tab="pend" aria-selected="true">Pendientes<span class="n" id="n-pend">0</span></button>
        <button class="tab" role="tab" data-tab="ready" aria-selected="false">Por enviar<span class="n" id="n-ready">0</span></button>
        <button class="tab" role="tab" data-tab="closed" aria-selected="false">Cerrados</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filtrar por categoría"></div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
